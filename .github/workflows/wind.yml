name: Wind KNMI
on:
  schedule:
    - cron: '7,37 4-17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wind.py data/wind.json
      - run: |
          git config user.name "Wind KNMI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wind.json
          if git diff --cached --quiet; then echo "geen nieuwe meting"; exit 0; fi
          git commit -m "Wind KNMI $(TZ=Europe/Amsterdam date '+%H:%M')"
          git pull --rebase -q origin main
          git push origin main
