<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Veiligheid BW">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Veiligheid Boogiewood</title>
<style>
:root{--color-fg:#e8ecf1;--color-fg-muted:#9aa6b3;--color-panel:#141a21;--color-border-line:#26303b;--color-bg:#0b0f14;
--color-ok:#4cc983;--color-warn:#f2a33a;--color-bad:#ff6b5e;--cds-radius:10px;--cds-chart-grid:#222a33;--cds-chart-axis:#3a4552;
--cds-chart-reference:#6b7785;--cds-chart-status-critical:#ff6b5e;--cds-chart-muted:#475260;
--font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--cds-font-size-body:14px;--cds-font-size-caption:12px;
--cds-dur-slow:400ms;--cds-ease-out:cubic-bezier(.2,.8,.2,1);--cds-text-secondary:#9aa6b3;--cds-surface-popover:#1b222a;
--cds-shadow-popover:0 8px 24px rgba(0,0,0,.5);--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-border:#2c3641}
html,body{margin:0;background:#0b0f14;color:#e8ecf1;font-family:var(--font-anthropic-sans);font-size:14px;-webkit-text-size-adjust:100%}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1440px;margin:0 auto;box-sizing:border-box;
padding:calc(8px + env(safe-area-inset-top)) 16px 8px;font-size:12px;color:#9aa6b3}
.appbar b{color:#e8ecf1;font-weight:600}
.appbar .oud{color:#f2a33a}
.appbar button{background:none;border:1px solid #2c3641;color:#9aa6b3;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
.appbar button:hover{color:#e8ecf1;border-color:#4a5866}
#dash-root{padding:0 0 calc(32px + env(safe-area-inset-bottom))}
body.locked #dash-root,body.locked .appbar{visibility:hidden}
#lock{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(120% 80% at 50% 0%,#0e2a4d 0%,#0b0f14 60%)}
body.locked #lock{display:flex}
.lk{width:100%;max-width:360px;background:#141a21;border:1px solid #26303b;border-radius:14px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lk .tag{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#00acec;font-weight:600}
.lk .tag:before{content:"";width:18px;height:2px;background:#00acec}
.lk h1{margin:10px 0 4px;font-size:22px;line-height:1.25;font-weight:700}
.lk h1 span{color:#00acec}
.lk p{margin:0 0 20px;color:#9aa6b3;font-size:13px;line-height:1.5}
.lk label{display:block;font-size:12px;color:#9aa6b3;margin-bottom:6px}
.lk input[type=password],.lk input[type=text]{width:100%;box-sizing:border-box;background:#0b0f14;border:1px solid #2c3641;border-radius:10px;
color:#e8ecf1;font:inherit;font-size:16px;padding:12px 14px;outline:none}
.lk input:focus{border-color:#00acec}
.lk .rij{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13px;color:#9aa6b3}
.lk .rij input{accent-color:#00acec;width:16px;height:16px}
.lk button{width:100%;background:#00acec;color:#00213f;border:0;border-radius:10px;padding:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.lk button:disabled{opacity:.6;cursor:default}
.lk .fout{min-height:18px;margin-top:10px;font-size:13px;color:#ff6b5e}
</style>
<script src="d3.min.js"></script>
<script>
window.__R = {}; window.__cbs = []; window.__ready = false;
window.dash = {
  calc() {},
  data(id) { return window.__R[id] ? { status: 'ok', data: window.__R[id] } : { status: 'loading' }; },
  onData(cb) { window.__cbs.push(cb); if (window.__ready) { try { cb(); } catch (e) { console.error(e); } } },
  setLink() {}
};
</script>
</head>
<body class="locked">
<div id="lock">
  <form class="lk" id="lkf" autocomplete="off">
    <div class="tag">Projectveiligheid · W1082</div>
    <h1>Veiligheidsdashboard <span>Boogiewood</span></h1>
    <p>Voer de toegangscode in die je van het projectteam hebt gekregen.</p>
    <label for="code">Toegangscode</label>
    <input id="code" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <div class="rij"><input type="checkbox" id="onthoud" checked><label for="onthoud" style="margin:0">Onthoud op dit apparaat</label></div>
    <button id="lkb" type="submit">Openen</button>
    <div class="fout" id="fout"></div>
  </form>
</div>
<div class="appbar"><span id="stand">Stand —</span><button id="slot" type="button">Vergrendelen</button></div>
<div id="dash-root">
{{DASH}}
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const SLEUTEL = 'bw_code';
  const lees = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const schrijf = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  let code = null, env = null, getoond = null;

  async function ontsleutel(e, c) {
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function haal() {
    const r = await fetch('data/app.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('net');
    return r.json();
  }
  function stempel() {
    if (!getoond) return;
    const d = new Date(getoond);
    const tekst = d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
    const oud = Date.now() - d.getTime() > 26 * 3600e3;
    $('#stand').innerHTML = 'Stand <b>' + tekst + '</b>' + (oud ? ' · <span class="oud">niet recent bijgewerkt</span>' : ' · ververst automatisch');
  }
  async function toon(e) {
    const R = await ontsleutel(e, code);
    window.__R = R; window.__ready = true; getoond = e.updated; env = e;
    for (const cb of window.__cbs) { try { cb(); } catch (x) { console.error(x); } }
    stempel();
  }
  async function open(c, onthoud) {
    code = c;
    if (!env) env = await haal();
    await toon(env);
    if (onthoud) schrijf(SLEUTEL, c);
    document.body.classList.remove('locked');
  }
  async function check() {
    if (!code || document.hidden) return;
    try { const e = await haal(); if (e.updated !== getoond) await toon(e); } catch (e) {}
  }

  $('#lkf').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const b = $('#lkb'); b.disabled = true; $('#fout').textContent = '';
    try { await open($('#code').value.trim(), $('#onthoud').checked); }
    catch (e) { code = null; $('#fout').textContent = e && e.message === 'net' ? 'Geen verbinding. Probeer het later opnieuw.' : 'Onjuiste toegangscode.'; }
    b.disabled = false;
  });
  $('#slot').addEventListener('click', () => { schrijf(SLEUTEL, null); location.reload(); });

  const bewaard = lees(SLEUTEL);
  if (bewaard) open(bewaard, true).catch((e) => { code = null; if (!(e && e.message === 'net')) schrijf(SLEUTEL, null); });
  setInterval(check, 5 * 60e3);
  document.addEventListener('visibilitychange', check);
  setInterval(stempel, 60e3);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
